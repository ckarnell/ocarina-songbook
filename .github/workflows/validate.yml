name: validate songs
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - run: ocarina validate
      - run: pytest -q
      # A song PR changes only files in songs/: anything else needs the owner.
      - name: only song files changed
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          if echo "$changed" | grep -qv '^songs/[a-z0-9_]*\.json$'; then
            echo "::warning::this PR changes more than song files: review it as a code change"
          fi
